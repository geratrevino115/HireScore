<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HireScore — Evaluación inteligente de candidatos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ── Light theme (default) ── */
    :root {
      --bg:             #F5F4F2;
      --surface:        #FFFFFF;
      --surface-2:      #F0EFED;
      --border:         #E5E4E2;
      --text-1:         #111110;
      --text-2:         #6B6B69;
      --text-3:         #A9A9A7;
      --accent:         #2B5CE6;
      --accent-light:   #EEF2FF;
      --accent-border:  #C7D7FF;
      --green:          #16A34A;
      --green-light:    #DCFCE7;
      --green-border:   #BBF7D0;
      --amber:          #D97706;
      --amber-light:    #FEF3C7;
      --amber-border:   #FDE68A;
      --red:            #DC2626;
      --red-light:      #FEE2E2;
      --red-border:     #FECACA;
      --purple:         #7C3AED;
      --purple-light:   #EDE9FE;
      --purple-border:  #DDD6FE;
      /* Notion tokens (scoped al dashboard "Notion") */
      --n-bg:           #FFFFFF;
      --n-surface:      #F7F6F3;
      --n-hover:        rgba(55,53,47,0.06);
      --n-divider:      rgba(55,53,47,0.09);
      --n-text:         #37352F;
      --n-text-2:       #787774;
      --n-text-3:       #9B9A97;
    }

    /* ── Dark theme ── */
    [data-theme="dark"] {
      --bg:             #0E0E0D;
      --surface:        #1A1A18;
      --surface-2:      #242422;
      --border:         #2E2E2C;
      --text-1:         #F2F1EF;
      --text-2:         #9B9B99;
      --text-3:         #5C5C5A;
      --accent:         #4B74F0;
      --accent-light:   rgba(75,116,240,0.12);
      --accent-border:  rgba(75,116,240,0.35);
      --green:          #22C55E;
      --green-light:    rgba(34,197,94,0.12);
      --green-border:   rgba(34,197,94,0.35);
      --amber:          #F59E0B;
      --amber-light:    rgba(245,158,11,0.12);
      --amber-border:   rgba(245,158,11,0.35);
      --red:            #EF4444;
      --red-light:      rgba(239,68,68,0.12);
      --red-border:     rgba(239,68,68,0.35);
      --purple:         #A78BFA;
      --purple-light:   rgba(167,139,250,0.12);
      --purple-border:  rgba(167,139,250,0.35);
      --n-bg:           #191919;
      --n-surface:      #202020;
      --n-hover:        rgba(255,255,255,0.055);
      --n-divider:      rgba(255,255,255,0.094);
      --n-text:         rgba(255,255,255,0.9);
      --n-text-2:       rgba(255,255,255,0.6);
      --n-text-3:       rgba(255,255,255,0.4);
    }

    body {
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text-1);
      height: 100vh;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    #root { height: 100vh; display: flex; }

    /* ── Scrollbar ── */
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--text-3); }

    /* ── Animations ── */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(2px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0; }
    }
    @keyframes pulse {
      from { transform: scaleY(0.5); }
      to   { transform: scaleY(1.5); }
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .fade-in { animation: slideUp 0.28s cubic-bezier(0.34,1.1,0.64,1) both; }

    /* ── Buttons reset ── */
    button { font-family: inherit; }
    input, textarea, select { font-family: inherit; }

    /* ── Notion-scoped utilities (solo dentro de .notion-page) ── */
    .notion-page {
      font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji";
      color: var(--n-text);
      background: var(--n-bg);
    }
    .notion-page ::selection { background: rgba(35,131,226,0.28); }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="voire-shared.jsx"></script>
  <script type="text/babel" src="voire-views.jsx"></script>
</body>
</html>
