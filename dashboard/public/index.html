<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HireScore</title>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ── Tema claro (Notion) ── */
    :root, [data-theme="light"] {
      --n-bg:        #ffffff;
      --n-sidebar:   #fbfbfa;
      --n-ink:       #37352f;
      --n-ink2:      #787774;
      --n-ink3:      #9b9a97;
      --n-ink4:      #c1c0bd;
      --n-hover:     #f3f3f1;
      --n-selected:  #e9e9e7;
      --n-selrow:    #f7f7f5;
      --n-border:    #ebebea;
      --n-border-hi: #d8d7d4;
      --n-track:     #ebebea;

      --c-gray-bg:   #f1f1ef; --c-gray-fg:   #5f5e5b;
      --c-brown-bg:  #f4eeee; --c-brown-fg:  #64473a;
      --c-orange-bg: #faebdd; --c-orange-fg: #b35f12;
      --c-yellow-bg: #fbf3db; --c-yellow-fg: #8a6d13;
      --c-green-bg:  #ddedea; --c-green-fg:  #0f7b6c;
      --c-cyan-bg:   #e0eef1; --c-cyan-fg:   #0b6e84;
      --c-blue-bg:   #ddebf1; --c-blue-fg:   #0b6e99;
      --c-purple-bg: #eae4f2; --c-purple-fg: #6940a5;
      --c-red-bg:    #fdebec; --c-red-fg:    #b4322f;
    }

    /* ── Tema oscuro (Notion dark) ── */
    [data-theme="dark"] {
      --n-bg:        #191919;
      --n-sidebar:   #202020;
      --n-ink:       #e6e6e4;
      --n-ink2:      #9b9b99;
      --n-ink3:      #6f6f6d;
      --n-ink4:      #565654;
      --n-hover:     #2a2a2a;
      --n-selected:  #323232;
      --n-selrow:    #232323;
      --n-border:    #2e2e2c;
      --n-border-hi: #3d3d3a;
      --n-track:     #313131;

      --c-gray-bg:   rgba(255,255,255,0.07); --c-gray-fg:   #b4b4b2;
      --c-brown-bg:  rgba(186,133,111,0.16); --c-brown-fg:  #c89b87;
      --c-orange-bg: rgba(217,115,13,0.17);  --c-orange-fg: #e3925a;
      --c-yellow-bg: rgba(203,145,47,0.17);  --c-yellow-fg: #ddb24a;
      --c-green-bg:  rgba(45,170,120,0.16);  --c-green-fg:  #4fcb96;
      --c-cyan-bg:   rgba(45,150,180,0.16);  --c-cyan-fg:   #5bb8d4;
      --c-blue-bg:   rgba(45,120,200,0.17);  --c-blue-fg:   #6aa3e8;
      --c-purple-bg: rgba(140,100,220,0.17); --c-purple-fg: #b08ae8;
      --c-red-bg:    rgba(220,80,80,0.17);   --c-red-fg:    #ec7676;
    }

    html, body { height: 100%; }
    body {
      font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      background: var(--n-bg);
      color: var(--n-ink);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      overflow: hidden;
    }
    #root { height: 100vh; width: 100vw; }

    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--n-border-hi); border-radius: 6px; border: 2px solid var(--n-bg); }
    ::-webkit-scrollbar-thumb:hover { background: var(--n-ink4); }

    button { font-family: inherit; }
    input, textarea, select { font-family: inherit; }

    @keyframes peekIn { from { opacity: 0; transform: translateX(8px); } to { opacity: 1; transform: translateX(0); } }
    .peek-anim { animation: peekIn 0.18s cubic-bezier(0.32,0.72,0.3,1) both; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="api.jsx"></script>
  <script type="text/babel" src="data.jsx"></script>
  <script type="text/babel" src="primitives.jsx"></script>
  <script type="text/babel" src="flowdata.jsx"></script>
  <script type="text/babel" src="auth.jsx"></script>
  <script type="text/babel" src="newvac.jsx"></script>
  <script type="text/babel" src="addcv.jsx"></script>
  <script type="text/babel" src="candidate.jsx"></script>
  <script type="text/babel" src="compare.jsx"></script>
  <script type="text/babel" src="screens.jsx"></script>
  <script type="text/babel" src="app.jsx"></script>
</body>
</html>
